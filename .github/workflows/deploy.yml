# Deploys the RAG service to ECS and the web app to S3 + CloudFront.
#
# Phase 5 of PRODUCTION_PLAN.md. Runs on merge to main, gated behind a GitHub
# Environment with a required reviewer, so a merge proposes a deploy rather
# than performing one.
#
# No AWS keys anywhere: the jobs assume an IAM role via OIDC (infra/github_oidc.tf),
# trusted only for this repository. AWS_DEPLOY_ROLE is a repository VARIABLE,
# not a secret -- it is an ARN, useless without that trust relationship.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the OIDC token exchange. id-token: write is what lets the job
# request a signed identity token; without it the role assumption fails.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: biogent-rag
  ECS_CLUSTER: biogent-cluster

  # Both services run the SAME image and differ only in the command ECS gives
  # it -- uvicorn for the API, `python -m app.worker` for the ingestion worker
  # (see infra/worker.tf). So one build feeds both, and a service missing from
  # this list silently keeps running whatever image it last got.
  #
  # Format: service:task-family:container-name, space separated.
  DEPLOY_TARGETS: "biogent-rag:biogent-rag:rag biogent-worker:biogent-worker:worker"

concurrency:
  # One deploy at a time. Two overlapping runs would race to update the same
  # service, and the loser would silently roll production backwards.
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: API and ingestion worker to ECS
    runs-on: ubuntu-latest
    environment: production # the manual approval gate
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Tagged with the commit SHA, never only :latest -- a rollback needs
          # to name a specific build, and "latest" cannot be named.
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" services/rag
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Roll out the new image to every service
        run: |
          set -euo pipefail

          # A service is only created by `terraform apply`, so a family that
          # does not exist yet fails here rather than being skipped -- a
          # silently un-deployed worker looks exactly like a healthy one that
          # never receives work.
          for target in $DEPLOY_TARGETS; do
            IFS=':' read -r service family container <<< "$target"
            echo "::group::$service"

            # Take the live definition, swap only the image, and register that.
            # Everything else (env vars, roles, sizing, the worker's command)
            # stays owned by Terraform.
            aws ecs describe-task-definition --task-definition "$family" \
              --query taskDefinition > "task-def-$service.json"

            jq --arg IMAGE "${{ steps.build.outputs.image }}" --arg NAME "$container" '
              .containerDefinitions = (
                .containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end)
              )
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' "task-def-$service.json" > "new-task-def-$service.json"

            ARN=$(aws ecs register-task-definition \
              --cli-input-json "file://new-task-def-$service.json" \
              --query taskDefinition.taskDefinitionArn --output text)

            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" \
              --task-definition "$ARN" >/dev/null
            echo "$service -> $ARN"
            echo "::endgroup::"
          done

      - name: Wait for every service to stabilize
        run: |
          set -euo pipefail

          # Waited on together, after all the updates, rather than one at a
          # time: the rollouts run concurrently anyway, so serialising the
          # waits would just add the slower one's time to the faster one's.
          #
          # Fails the job if the new tasks never become healthy, so a broken
          # deploy surfaces here rather than as a researcher's error page.
          SERVICES=""
          for target in $DEPLOY_TARGETS; do
            SERVICES="$SERVICES ${target%%:*}"
          done

          # shellcheck disable=SC2086 # deliberate word splitting into arguments
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services $SERVICES

  frontend:
    name: Web app to S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production
    # After the backend: if the API fails to deploy, do not ship a frontend
    # that expects it.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        working-directory: frontend
        env:
          # Relative, not absolute: CloudFront serves the app and the API from
          # one domain, so the request is same-origin and needs no host.
          VITE_API_BASE_URL: /api
          # Cognito identifiers, from `terraform output`. Repository variables
          # rather than secrets: a public SPA client id and an issuer URL are
          # both readable in the built bundle anyway. Kept out of
          # .env.production so recreating the user pool does not need a commit.
          VITE_COGNITO_AUTHORITY: ${{ vars.COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
        run: |
          npm ci
          npm run build

      - name: Publish
        working-directory: frontend
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          # Hashed asset filenames can be cached hard; index.html must not be,
          # or browsers keep loading the old app after a deploy.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          # Without this the edge keeps serving the previous index.html until
          # its TTL expires -- the classic "why am I still seeing the old build".
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/"
