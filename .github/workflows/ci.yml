# T0 CI tier: fast checks that run on every push/PR, per the tiered approach
# documented in ARCHITECTURE.md (Development & Deployment Workflow), modeled
# on corpus's own CI structure.
#
# The frontend block is still a placeholder (nothing exists there yet,
# Phase 4). The RAG service block is now real — services/rag has actual
# tests (services/rag/tests/) that need no API key, per the tests-vs-evals
# split in ARCHITECTURE.md.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege by default — this workflow doesn't need to write to the
# repo or access secrets. Tighten/loosen per-job if that changes later.
permissions:
  contents: read

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm repo structure
        run: |
          echo "Checking expected top-level structure exists..."
          test -d services/rag
          test -d services/data-agent
          test -d frontend
          echo "OK — scaffold structure present."

  rag-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (no API key required)
        env:
          # Guard: make sure nothing in the suite quietly reaches a real
          # model — matches the pattern from the reference CI file this
          # was modeled on. Tests importing app.query/app.ingest should
          # never actually need a working key to pass.
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q

      # --- Placeholder: frontend lint + build (fill in during Phase 4) ---
