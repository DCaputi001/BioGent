# T0 CI tier: fast checks that run on every push/PR, per the tiered approach
# documented in ARCHITECTURE.md (Development & Deployment Workflow), modeled
# on corpus's own CI structure.
#
# This is a scaffold: services/rag has no code yet (Phase 2), so there's
# nothing to lint or test against yet. The steps below are placeholders that
# intentionally succeed today, marking exactly where real steps get added
# once each service exists. Expand this file incrementally — don't wait
# until "everything" is ready to make CI meaningful.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege by default — this workflow doesn't need to write to the
# repo or access secrets. Tighten/loosen per-job if that changes later.
permissions:
  contents: read

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm repo structure
        run: |
          echo "Checking expected top-level structure exists..."
          test -d services/rag
          test -d services/data-agent
          test -d frontend
          echo "OK — scaffold structure present."

