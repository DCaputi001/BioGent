# T0 CI tier: fast checks that run on every push/PR, per the tiered approach
# documented in ARCHITECTURE.md (Development & Deployment Workflow), modeled
# on corpus's own CI structure.
#
# The frontend block is still a placeholder (nothing exists there yet,
# Phase 4). The RAG service block is now real — services/rag has actual
# tests (services/rag/tests/) that need no API key, per the tests-vs-evals
# split in ARCHITECTURE.md.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege by default — this workflow doesn't need to write to the
# repo or access secrets. Tighten/loosen per-job if that changes later.
permissions:
  contents: read

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm repo structure
        run: |
          echo "Checking expected top-level structure exists..."
          test -d services/rag
          test -d services/data-agent
          test -d frontend
          echo "OK — scaffold structure present."

  secret-scan:
    # Blocks committed credentials (AWS keys, database URLs with passwords,
    # API keys) from reaching main. Real secrets live in AWS Secrets Manager
    # and local git-ignored .env files only. See AGENTS.md "don't" list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret committed and then deleted in a later
          # commit is still caught.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # Lets the action read the commit range of a pull request. Personal
          # repositories need no GITLEAKS_LICENSE.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rag-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (no API key required)
        env:
          # Guard: make sure nothing in the suite quietly reaches a real
          # model — matches the pattern from the reference CI file this
          # was modeled on. Tests importing app.query/app.ingest should
          # never actually need a working key to pass.
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q

  rag-image-build:
    # Phase 5's first bullet: prove the image builds before a deploy depends on
    # it. Build only, no push — pushing to ECR belongs to deploy.yml, which runs
    # on main, not on every PR.
    #
    # COST NOTE: this is the slowest job in the workflow, because the image
    # pulls Docling and PyTorch. The GitHub Actions cache keeps repeat builds
    # cheap; if it becomes a nuisance on PRs that never touch the service, add
    # a paths filter rather than deleting the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build RAG image
        uses: docker/build-push-action@v6
        with:
          context: services/rag
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-tests:
    # Its own job rather than extra steps on the RAG one: the two have no
    # shared setup, and a Python failure should not hide a frontend failure.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node used locally; Vite 8 requires 20.19+.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: fails on a package-lock.json that has drifted from
      # package.json instead of quietly resolving new versions.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests (no API key required)
        run: npm test

      # Type-checks via tsc -b before bundling, so a bad backend contract
      # change fails here rather than in a researcher's browser.
      - name: Build
        run: npm run build