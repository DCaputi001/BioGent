[project]
name = "biogent-rag"
version = "0.1.0"
description = "BioGent RAG document-search service"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-anthropic",
    "langchain-huggingface",
    "langchain-chroma",
    "langchain-core",
    "langchain-text-splitters",
    "chromadb",
    "sentence-transformers",
    "python-dotenv",
    # Structure-aware PDF parsing + chunking, replacing pypdf +
    # RecursiveCharacterTextSplitter — see ARCHITECTURE.md
    # "Document parsing & chunking: Docling + HybridChunker".
    "docling",
    "transformers",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]