[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "biogent-rag"
version = "0.1.0"
description = "BioGent RAG document-search service"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-anthropic",
    "langchain-huggingface",
    "langchain-core",
    "langchain-text-splitters",
    "sentence-transformers",
    "python-dotenv",
    # Structure-aware PDF parsing + chunking — see ARCHITECTURE.md
    # "Document parsing & chunking: Docling + HybridChunker".
    "docling",
    "transformers",
    # Vector store: Postgres + pgvector — see ARCHITECTURE.md
    # "Data layer: one unified database instead of many". Replaces
    # chromadb/langchain-chroma from Step 1.
    "langchain-postgres",
    "psycopg[binary]",
    "boto3>=1.43.95",
    # HTTP API (app/api.py) — the researcher-facing endpoint the web frontend
    # calls. See PRODUCTION_PLAN.md Phase 4.
    "fastapi",
    "uvicorn[standard]",
    # Verifying Amazon Cognito access tokens (app/auth.py) — Cognito is the auth
    # mechanism ARCHITECTURE.md settled on, and its tokens are RS256 JWTs checked
    # against a published JWKS endpoint. The [crypto] extra is what supplies RS256;
    # without it PyJWT can only handle symmetric algorithms and every token fails.
    "pyjwt[crypto]",
    # Schema migrations for this project's own tables (app/models.py). The
    # langchain_pg_* tables stay owned by langchain-postgres, which creates them
    # itself; Alembic manages only what we define. SQLAlchemy is already a
    # transitive dependency, so this adds the migration runner, not an ORM.
    "alembic",
    # Listed explicitly, though docling and sentence-transformers would pull
    # them in anyway: a transitive dependency cannot be pointed at the CPU-only
    # index below, and a direct one can. torchvision has to be pinned to the
    # same index as torch -- mixing a CPU torch with a default-index
    # torchvision builds an image that imports torch fine and then dies with
    # "operator torchvision::nms does not exist" the first time transformers
    # loads a model.
    "torch",
    "torchvision",
]

# PyTorch's default Linux wheels bundle CUDA, which is gigabytes of GPU runtime
# that cannot execute on Fargate (or on any machine this project targets —
# embeddings run on CPU per ARCHITECTURE.md, with GPU deferred to the BGE-M3
# cutover). Resolving torch from the CPU index instead is what takes the
# container image from ~10.7GB to something deployable.
#
# explicit = true keeps this index scoped to the packages named in
# [tool.uv.sources]; without it, uv would search it for every dependency.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
