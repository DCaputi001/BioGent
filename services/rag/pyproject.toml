[tool.pytest.ini_options]
pythonpath = ["."]

[project]
name = "biogent-rag"
version = "0.1.0"
description = "BioGent RAG document-search service"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-anthropic",
    "langchain-huggingface",
    "langchain-core",
    "langchain-text-splitters",
    "sentence-transformers",
    "python-dotenv",
    # Structure-aware PDF parsing + chunking — see ARCHITECTURE.md
    # "Document parsing & chunking: Docling + HybridChunker".
    "docling",
    "transformers",
    # Vector store: Postgres + pgvector — see ARCHITECTURE.md
    # "Data layer: one unified database instead of many". Replaces
    # chromadb/langchain-chroma from Step 1.
    "langchain-postgres",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]