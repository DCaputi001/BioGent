# Local Postgres + pgvector, plus the RAG app service itself (Step 4).
#
# NETWORKING NOTE: inside this compose network, containers reach each other
# by SERVICE NAME, not "localhost". config.py's default RAG_DATABASE_URL
# points at "localhost:5432", which is correct when running `uv run`
# directly on your host machine (Step 1-2's workflow) — but from INSIDE the
# rag container, "localhost" would mean the rag container itself, not the
# postgres container. That's why the rag service below overrides
# RAG_DATABASE_URL to use the hostname "postgres" (the service name) instead.
#
# PRECEDENCE NOTE: that override also beats anything in .env — compose applies
# `environment:` after `env_file:`. This is deliberate; compose stays a
# self-contained local stack. So a .env pointing at RDS changes where host runs
# (`uv run python -m app.ingest`) write, but NOT where `docker compose run rag`
# writes. To have the container hit RDS too, remove the override below and set
# RAG_DB_SECRET_ID (plus RAG_DB_HOST/RAG_DB_NAME) in .env. The RDS password is
# fetched from AWS Secrets Manager at runtime and never placed in this file or .env.
#
# CREDENTIALS NOTE: the biogent/biogent login below is a throwaway for this
# local-only database, not a real secret. AWS access (S3, Secrets Manager) comes
# from your AWS CLI profile: AWS_PROFILE in .env plus the read-only ~/.aws mount
# on the rag service. No AWS access keys belong in .env.
#
# Start:               docker compose up -d
# Run ingestion:        docker compose run --rm rag python -m app.ingest
# Run ingestion fresh:   docker compose run --rm rag python -m app.ingest --reset
# Run the query loop:   docker compose run --rm rag python -m app.query
# Stop:                 docker compose stop
# Reset (wipes all data, including the model cache): docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biogent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biogent}
      POSTGRES_DB: ${POSTGRES_DB:-biogent_rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biogent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Overrides config.py's "localhost" default — see NETWORKING NOTE
      # above. "postgres" here resolves to the postgres service's
      # container via Docker's internal DNS, not to your host machine.
      RAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biogent}:${POSTGRES_PASSWORD:-biogent}@postgres:5432/${POSTGRES_DB:-biogent_rag}
    depends_on:
      postgres:
        # Waits for Postgres's healthcheck to pass, not just for the
        # container to start — Postgres takes a few seconds to actually
        # accept connections after launching.
        condition: service_healthy
    volumes:
      # Your local data/ folder, mounted into the container so ingestion
      # can see whatever PDFs/text files you've dropped there — without
      # this, the container would only see whatever was present at build
      # time (nothing, since data/ is git-ignored and not copied by the
      # Dockerfile).
      - ./data:/app/data
      # Persists downloaded models (the embedding model, Docling's layout
      # model, TableFormer, RapidOCR) across container runs. Without this,
      # EVERY `docker compose run` would re-download everything from
      # scratch, since a fresh container has no memory of the last one.
      - hf-cache:/home/appuser/.cache
      # Your AWS CLI config and credentials, read-only, so AWS_PROFILE from .env
      # resolves inside the container the same way it does on the host. Without
      # it boto3 raises ProfileNotFound and --from-s3 / RAG_DB_SECRET_ID fail.
      # USERPROFILE is the Windows home directory; HOME covers macOS/Linux.
      - ${USERPROFILE:-${HOME}}/.aws:/home/appuser/.aws:ro

volumes:
  pgdata:
  hf-cache: